services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sourcelab-postgres-build
    environment:
      POSTGRES_DB: sourcelab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - sourcelab_pg_data:/var/lib/postgresql/data
     
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sourcelab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sourcelab_pg_data:
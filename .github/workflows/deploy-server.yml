name: Deploy Server to EC2

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/sourcelab-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile.prod
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/${{ secrets.EC2_USERNAME }}/sourcelab"

      - name: Pull image and restart container
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SERVER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sourcelab-server
          IMAGE_TAG: ${{ github.sha }}
          EC2_HOME_USER: ${{ secrets.EC2_USERNAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script_stop: true
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,SERVER_IMAGE,IMAGE_TAG,EC2_HOME_USER
          script: |
            set -euo pipefail
            cd "/home/${EC2_HOME_USER}/sourcelab"

            if [ ! -f ./server/.env.production ]; then
              echo "./server/.env.production is missing on the server. Create it before deploying."
              exit 1
            fi

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            export SERVER_IMAGE
            export IMAGE_TAG

            docker compose -f docker-compose.prod.yml pull server
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --force-recreate --wait --wait-timeout 180

            docker image prune -af
            docker logout
